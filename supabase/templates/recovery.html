<!--
  비밀번호 재설정 메일. forgot-password가 resetPasswordForEmail로 보내고, {{ .ConfirmationURL }}
  링크가 /reset-password로 떨어진다(reset-password.tsx가 detectSessionInUrl로 세션을 만든다).
  그래서 코드가 아니라 링크(버튼)다.

  재설정은 신원키를 회전시켜 지난 1:1 대화를 포기시키므로(docs/e2ee.md), 그 경고를 메일에도
  담는다 -- 클릭하기 전에 알아야 한다. 이메일 클라이언트는 CSS 지원이 제각각이라 table 레이아웃 +
  인라인 스타일만 쓰고, align 속성 대신 text-align/margin을 쓴다.
-->
<!doctype html>
<html lang="ko">
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      -webkit-font-smoothing: antialiased;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;,
        Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td style="padding: 40px 16px; text-align: center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 440px;
              margin: 0 auto;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 16px;
              box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            "
          >
            <tr>
              <td style="padding: 36px 40px 0; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    font-weight: 700;
                    letter-spacing: -0.01em;
                    color: #18181b;
                  "
                >
                  KMLA Online
                </p>
                <h1 style="margin: 22px 0 0; font-size: 20px; font-weight: 600; color: #18181b">
                  비밀번호 재설정
                </h1>
                <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: #71717a">
                  아래 버튼을 눌러 새 비밀번호를 설정하세요.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 40px 4px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      style="
                        background-color: #fef2f2;
                        border: 1px solid #fecaca;
                        border-radius: 12px;
                        padding: 14px 16px;
                        text-align: left;
                      "
                    >
                      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #71717a">
                        <strong style="color: #b91c1c; font-weight: 600"
                          >재설정하면 지난 1:1 대화는 영구히 열 수 없게 됩니다.</strong
                        >
                        새 대화는 정상적으로 주고받을 수 있습니다.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 40px 8px; text-align: center">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #18181b;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 600;
                    text-decoration: none;
                    padding: 13px 28px;
                    border-radius: 10px;
                  "
                  >새 비밀번호 설정</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 4px 40px 32px; text-align: center">
                <p style="margin: 0; font-size: 13px; color: #a1a1aa">
                  링크는 1시간 후 만료됩니다.
                </p>
                <p
                  style="
                    margin: 20px 0 0;
                    padding-top: 20px;
                    border-top: 1px solid #f4f4f5;
                    font-size: 12px;
                    line-height: 1.7;
                    color: #a1a1aa;
                  "
                >
                  버튼이 열리지 않으면 아래 주소를 브라우저에 붙여넣으세요.<br />
                  <span style="color: #71717a; word-break: break-all">{{ .ConfirmationURL }}</span>
                </p>
                <p style="margin: 16px 0 0; font-size: 12px; line-height: 1.7; color: #a1a1aa">
                  본인이 요청하지 않았다면 이 메일을 무시하세요. 비밀번호는 바뀌지 않습니다.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 20px 0 0; font-size: 11px; color: #d4d4d8; text-align: center">
            © KMLA Online
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
